# twiddle configuration (TOML). Copy to one of:
#   ./twiddle.toml
#   ~/.config/twiddle/config.toml
#   /etc/twiddle/config.toml
# or point $TWIDDLE_CONFIG at it. All values below are optional; omitted
# values fall back to the built-in defaults shown here.

[service]
# Unix socket the service listens on and the CLI talks to. Default:
# $TWIDDLE_SOCKET, else $XDG_RUNTIME_DIR/twiddle.sock, else /tmp/twiddle.sock.
# The service makes it mode 0660, so the socket's owner and group decide who
# may read meters and reset counters. The systemd unit uses
# /run/twiddle/twiddle.sock.
# socket = "/run/twiddle/twiddle.sock"
# Optional read-only HTTP/JSON endpoint on 127.0.0.1 (omit to disable).
# http_port = 8731
# One web origin whose pages may read that endpoint from a browser; "*" and
# "null" are refused. Omit it to send no CORS header, so pages from other
# origins cannot read it.
# http_cors_origin = "http://localhost:3000"
log_level = "INFO"

[ble]
connect_timeout = 8.0     # seconds per connect attempt (includes the scan)
reconnect_delay = 2.0     # seconds to wait between reconnect attempts
stale_timeout   = 12.0    # reconnect if no frame arrives for this long
command_timeout = 8.0     # seconds to wait for a command (e.g. reset) to write
clear_cache_after = 6     # run `bluetoothctl remove <mac>` every N failures (0=never)

# --- Devices -------------------------------------------------------------
# Give each meter a short name. Run `twiddle scan` to find the MAC addresses
# of the meters in range, then list each one here. These two are examples.

[devices.meter-a]
mac  = "AA:BB:CC:DD:EE:01"
note = "USB load test"

[devices.meter-b]
mac  = "AA:BB:CC:DD:EE:02"
note = "DC supply"
